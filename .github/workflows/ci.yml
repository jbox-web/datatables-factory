---
name: CI

permissions: {}

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 4 1 * *'
  # Run workflow manually
  workflow_dispatch:

jobs:
  webpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install NodeJS dependencies
        run: mise dev:deps

      - name: Run Webpack with linters
        run: mise dev:build

  rspec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install NodeJS dependencies
        run: mise dev:deps

      # The dummy app loads the compiled bundle via the asset pipeline, so the
      # JS must be built before the system specs run.
      - name: Build JS bundle
        run: mise dev:build

      # The system specs run against spec/dummy, which has its own bundle
      # (bin/rspec sets BUNDLE_GEMFILE=spec/dummy/Gemfile).
      - name: Install Ruby gems (dummy app)
        env:
          BUNDLE_GEMFILE: spec/dummy/Gemfile
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3

      - name: Prepare test database
        working-directory: spec/dummy
        env:
          BUNDLE_GEMFILE: Gemfile
          RAILS_ENV: test
        run: bundle exec rails db:test:prepare

      # Cuprite drives headless Chrome (preinstalled on ubuntu-latest runners).
      - name: Run system specs
        run: bin/rspec
