# Only the keys the engine cannot provide: per-column filter labels are
# application data. Everything else (DataTables language, the select-all button
# titles, "Filter by") comes from the engine's own config/locales/en.yml.
en:
  datatables:
    filter:
      first_name: "first name"
      last_name:  "last name"
      email:      "email"
      role:       "role"
      age:        "age"
      created_at: "created at"
